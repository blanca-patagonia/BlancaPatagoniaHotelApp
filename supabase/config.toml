# Configuración del proyecto local de Supabase (Supabase CLI).
# Para regenerar una versión completa: `supabase init`.
project_id = "blanca-patagonia"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
# El staff NO se auto-registra: los usuarios los crea un administrador desde
# `app/panel/usuarios` con el cliente `service_role` (ADR 0005). Con el registro
# abierto, cualquiera con la clave publicable —que viaja al navegador por
# diseño— podía crearse una cuenta, y hasta la migración 0032 esa cuenta nacía
# con rol de recepción activo.
#
# ⚠️ Esta línea configura el Supabase LOCAL. En el proyecto hosted hay que
# apagarlo además en Authentication → Providers, donde el default de la
# plataforma es «habilitado».
enable_signup = false

[auth.email]
# ⚠️ ESTA LÍNEA NO ES «no dejes que se registren»: eso ya lo hace
# `[auth].enable_signup = false` de arriba, que bloquea el alta por CUALQUIER
# proveedor.
#
# `[auth.email].enable_signup` controla si el proveedor de email está habilitado, y
# ponerlo en `false` desactiva **también el inicio de sesión con contraseña**. Es
# decir: con `false`, NADIE PUEDE ENTRAR AL PANEL. `app/login/actions.ts` usa
# `signInWithPassword`, que es el único camino de acceso del staff.
#
# El error que devuelve GoTrue es «Email logins are disabled», y no aparece hasta que
# alguien levanta el entorno desde cero — por eso pasó desapercibido: un contenedor
# que ya estaba corriendo conserva la configuración con la que arrancó. Lo detectó el
# CI, que hace `supabase start` limpio en cada corrida.
#
# Las dos cosas que hay que sostener a la vez, y que tienen su test:
#   · el staff SÍ inicia sesión con email y contraseña
#   · nadie se auto-registra  (ADR 0017, migraciones 0032 + 0035)
enable_signup = true
enable_confirmations = false

# ── Google ───────────────────────────────────────────────────────────────────
# Comodidad para el staff: en un puesto de recepción compartido, entrar con la
# cuenta del hotel evita tipear una contraseña delante del huésped.
#
# ⚠️ ESTO NO ABRE EL REGISTRO. `[auth].enable_signup = false` de arriba impide que
# GoTrue **cree** un usuario por cualquier proveedor, Google incluido. Iniciar
# sesión con Google solo funciona para alguien cuyo email ya fue dado de alta
# desde `app/panel/usuarios` (ADR 0005 y 0017). Y si esa línea se aflojara, la
# segunda barrera sigue: un perfil creado fuera del alta nace `sin_rol` y
# `activo = false` (migraciones 0032 y 0035).
#
# Las credenciales salen de Google Cloud → APIs y servicios → Credenciales →
# ID de cliente de OAuth (tipo «aplicación web»), con este URI de redirección
# autorizado:
#     http://127.0.0.1:54321/auth/v1/callback        (local)
#     https://<proyecto>.supabase.co/auth/v1/callback (hosted)
#
# ─────────────────────────────────────────────────────────────────────────────
# ESTE `enabled` ES EL ÚNICO INTERRUPTOR. La pantalla de login le pregunta a
# GoTrue por `/auth/v1/settings` y muestra el botón solo si acá dice `true`.
#
# Antes había dos: éste y `AUTH_GOOGLE_HABILITADO` en la app. Con la variable en
# `1` y esto en `false`, el botón aparecía y GoTrue respondía un JSON crudo
# —«Unsupported provider: provider is not enabled»— sin vuelta atrás. Ya no puede
# pasar: la app no adivina, pregunta.
#
# Para encenderlo hacen falta LOS TRES PASOS, en este orden:
#   1. Crear las credenciales en Google Cloud (ver arriba) y exportar
#      GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET.
#   2. Poner `enabled = true` acá abajo.
#   3. **Reiniciar el contenedor**: `npx supabase stop && npx supabase start`.
#      GoTrue lee esta configuración al arrancar, así que sin el reinicio el
#      cambio no tiene ningún efecto y parece que no funcionara.
#
# `AUTH_GOOGLE_HABILITADO` sigue existiendo, pero solo en `0` y solo para APAGAR:
# esconde el botón sin tocar Supabase. Encenderlo ya no depende de esa variable.
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = ""

[storage]
enabled = true
