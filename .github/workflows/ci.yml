name: CI

on:
  # Todas las ramas, no solo `main`.
  #
  # Antes el workflow disparaba en push a `main` y en pull request, así que el
  # trabajo de una rama se validaba recién al abrir el PR — con 40 commits
  # encima. Si algo se rompió en el quinto, se descubría en el cuadragésimo.
  # Llegó a haber cinco ramas divergidas, la mayor con 50 commits sin una sola
  # corrida. El `concurrency` de abajo evita que esto multiplique las corridas:
  # cancela la anterior de la misma rama.
  push:
    branches: ['**']
  pull_request:

# Varios push seguidos generaban corridas apiladas que competían por el runner.
# Solo interesa la última: las anteriores se cancelan.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    # Si `supabase start` se cuelga esperando a Docker, sin esto la corrida se
    # queda tomada hasta el límite por defecto de 6 horas.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          # 22 es la LTS vigente. Con 20 el runner podía traer una versión
          # anterior a la 20.12, que es desde donde existe
          # `--env-file-if-exists`, y eso hacía fallar el paso del seed.
          node-version: 22
          cache: npm

      - name: Versiones (para diagnosticar)
        run: |
          echo "node   $(node -v)"
          echo "npm    $(npm -v)"
          echo "docker $(docker --version)"

      - name: Instalar dependencias
        run: npm ci

      # ── Supabase local ────────────────────────────────────────────────────
      # Sin base, los tests de integración (anti-overbooking, cotización,
      # expiración y alta atómica) se saltean en silencio y el CI queda verde
      # sin haber verificado la garantía central del sistema (ADR 0002).
      # El runner de GitHub ya trae Docker, y el CLI es una devDependency.
      # `supabase start` baja varias imágenes de `supabase/*` desde Docker
      # Hub, y los runners de GitHub comparten IP entre miles de jobs: es
      # común pegarle al límite de pulls anónimos ("toomanyrequests: Rate
      # exceeded") sin que el cambio del PR tenga nada que ver. Encontrado en
      # las corridas de los PRs #95 y #96 (bumps de GitHub Actions, sin
      # relación con Docker). Tres intentos con `stop` entre medio -si quedó
      # algún contenedor a medio levantar, el segundo `start` falla con "ya
      # está corriendo" en vez de reintentar- y espera creciente para no
      # pegarle al límite de nuevo enseguida.
      - name: Levantar Supabase local
        run: |
          intentos=3
          espera=30
          for i in $(seq 1 "$intentos"); do
            if npx supabase start; then
              exit 0
            fi
            echo "::warning::'supabase start' falló (intento $i de $intentos)."
            if [ "$i" = "$intentos" ]; then
              echo "::error::'supabase start' no arrancó tras $intentos intentos."
              exit 1
            fi
            npx supabase stop || true
            sleep "$espera"
            espera=$((espera * 2))
          done

      - name: Exportar credenciales de la base
        run: |
          estado=$(npx supabase status -o env)
          api=$(echo "$estado" | grep '^API_URL=' | cut -d= -f2- | tr -d '"')
          key=$(echo "$estado" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '"')
          anon=$(echo "$estado" | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')

          # Si el CLI cambia el formato de `status -o env`, estas variables
          # quedarían vacías y la falla aparecería más tarde y disfrazada:
          # los tests dirían "falta la base" y el build, "URL inválida". Se
          # corta acá, donde el mensaje señala la causa real.
          if [ -z "$api" ] || [ -z "$key" ] || [ -z "$anon" ]; then
            echo "::error::No se pudieron leer las credenciales de 'supabase status -o env'."
            echo "Salida recibida:"
            echo "$estado"
            exit 1
          fi

          {
            echo "SUPABASE_URL=$api"
            echo "SUPABASE_SERVICE_ROLE_KEY=$key"
            echo "NEXT_PUBLIC_SUPABASE_URL=$api"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$anon"
          } >> "$GITHUB_ENV"

      # `supabase start` aplica migraciones y seed, pero el seed NO crea
      # perfiles: se crean con la API de auth, que necesita el service_role.
      # Sin este paso la tabla `perfiles` queda vacía y los tests de
      # facturación fallan por la clave foránea de "quién emitió". Era la causa
      # de que este workflow nunca haya terminado en verde.
      #
      # Se invoca `node` directo y NO `npm run seed:usuarios`. El script de npm
      # lleva `--env-file-if-exists=.env.local`, una opción que solo existe
      # desde Node 20.12: acá las credenciales llegan por `GITHUB_ENV`, no hace
      # falta leer ningún archivo, y así el paso no depende de la versión de
      # Node que traiga el runner.
      - name: Crear el usuario administrador
        run: |
          # `supabase start` vuelve cuando los contenedores están arriba, pero
          # la API de auth puede tardar un instante más en responder. Se espera
          # a que conteste antes de crear el usuario.
          for i in $(seq 1 30); do
            if curl -sf "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" > /dev/null; then
              echo "auth respondió en el intento $i"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::La API de auth no respondió tras 30 intentos."
              exit 1
            fi
            sleep 2
          done

          node scripts/seed-usuarios.mjs

      # ── Verificación ──────────────────────────────────────────────────────

      # Vulnerabilidades conocidas de las dependencias.
      #
      # Va PRIMERO y es barato: no necesita la base ni el build. Cuando se agregó
      # había 8 vulnerabilidades abiertas —6 altas, incluidas SSRF en Server
      # Actions y exposición de endpoints internos de Next— que nadie había visto
      # porque nada las miraba.
      #
      # `--audit-level=high` y no `moderate`: con el umbral en moderate el paso se
      # pone rojo por cosas que no se pueden arreglar hoy, y un CI que falla
      # siempre deja de leerse. Las moderadas quedan visibles en la salida.
      #
      # ── Por qué el gate bloqueante mira SÓLO lo que se despliega ────────────
      #
      # El 2026-10-07 pasó, un escalón más arriba, exactamente lo que ese párrafo
      # advertía: apareció una cadena de severidad ALTA **sin arreglo posible**.
      #
      #   braces → micromatch → fast-glob → @next/eslint-plugin-next → eslint-config-next
      #
      # Es un DoS por agotamiento de pila con patrones muy anidados
      # (GHSA-vfj7-8cjw-p6xm). No se puede cerrar hoy, y no por desidia:
      # `npm audit` reporta `braces *` —todas las versiones afectadas, la última
      # es la 3.0.3— y `fast-glob@latest` sigue colgando de `micromatch`. Un
      # `overrides` no tiene a qué apuntar. Lo único que propone
      # `npm audit fix --force` es bajar `eslint-config-next` a la 14.2.35: dos
      # versiones mayores para atrás, con Next 16 instalado. Eso rompe el lint.
      #
      # Así que el gate quedaba insatisfacible, y un gate insatisfacible no
      # protege: se vuelve ruido que se saltea.
      #
      # La línea nueva es **qué se despliega**. `--omit=dev` audita las
      # dependencias de producción: lo que corre en el servidor del hotel y lo
      # que viaja al navegador del huésped. Ahí un alta bloquea, sin excepciones.
      # `eslint-config-next` no está en esa foto: lo único que le pasa patrones
      # es `npm run lint`, con los globs de este repo, en la máquina de quien
      # desarrolla.
      #
      # ⚠️ Esto NO es «ignorar las de desarrollo». El paso siguiente las sigue
      # auditando y las imprime enteras; lo que no hace es cortar la corrida por
      # algo que nadie puede arreglar. Si aparece una alta en desarrollo que SÍ
      # tiene arreglo, se ve en la salida y se arregla.
      - name: Vulnerabilidades de lo que se despliega (bloquea)
        run: npm audit --omit=dev --audit-level=high

      - name: Vulnerabilidades de las herramientas de desarrollo (informativo)
        run: npm audit --audit-level=high || true

      - name: Typecheck (TypeScript)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      # EXIGIR_DB=1 convierte la ausencia de base en un ERROR: si `supabase
      # start` falló, la suite no puede pasar salteando los tests que importan.
      - name: Tests (Vitest, incluidos los de integración)
        run: npm test
        env:
          EXIGIR_DB: '1'

      - name: Build (Next.js)
        run: npm run build

      # Diagnóstico: si algo falló, los registros de los contenedores suelen
      # explicar por qué mucho mejor que el error de la aplicación.
      - name: Registros de Supabase (si algo falló)
        if: failure()
        run: npx supabase status || true

      - name: Apagar Supabase
        if: always()
        run: npx supabase stop
