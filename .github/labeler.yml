# Etiquetas automáticas según los archivos que toca cada PR.
# Usa las etiquetas que ya existen en el repo.
"area: frontend":
  - changed-files:
      - any-glob-to-any-file:
          - "src/app/(front-publico)/**"
          - "src/app/(front-gestion)/**"
          - "src/app/*.tsx"
          - "src/app/*.css"
          - "public/**"
"area: backend":
  - changed-files:
      - any-glob-to-any-file:
          - "src/app/(back-api)/**"
          - "src/lib/**"
          - "src/proxy.ts"
          - "src/instrumentation.ts"
"area: base de datos":
  - changed-files:
      - any-glob-to-any-file:
          - "supabase/**"
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"
github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
seguridad:
  - changed-files:
      - any-glob-to-any-file:
          - "SECURITY.md"
          - "src/proxy.ts"
